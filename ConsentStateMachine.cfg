\* TLC configuration for the multi-provider ConsentStateMachine spec.
\* Providers is now a SET of 2 model values (p1, p2), testing all
\* interleavings between two providers concurrently requesting/holding
\* access to the same patient's study.

CONSTANTS
    Patient = Patient
    p1 = p1
    p2 = p2
    Providers = {p1, p2}

SPECIFICATION Spec

INVARIANTS
    TypeInvariant
    SubjectControl
    NonBypassableExpiry
